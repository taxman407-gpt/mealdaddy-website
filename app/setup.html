<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173f35" />
  <meta name="robots" content="noindex" />
  <title>Set up Meal Daddy</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css?v=20260806-1" />
</head>
<body class="setup-page auth-loading">
  <header class="setup-header">
    <a class="brand" href="./app.html"><span class="brand-mark">M</span><span>MealDaddy</span></a>
    <button class="text-button" id="save-exit" type="button">Save & exit</button>
  </header>
  <main class="setup-shell">
    <section class="setup-card" aria-labelledby="setup-title">
      <div class="setup-progress"><div id="setup-progress-bar"></div></div>
      <p class="eyebrow" id="setup-step-label">Quick setup</p>
      <h1 id="setup-title">About you</h1>
      <p class="setup-intro" id="setup-intro">Most people finish in under five minutes. Optional questions can be skipped.</p>
      <form id="setup-form"><div id="setup-fields"></div></form>
      <div class="setup-actions">
        <button class="button button-quiet" id="setup-back" type="button">Back</button>
        <button class="button button-primary" id="setup-next" type="button">Next</button>
      </div>
      <p class="privacy-line">Your answers are stored in your protected Meal Daddy profile. Health-related questions are optional and are not medical advice.</p>
      <p class="auth-status" id="setup-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="./setup.js?v=20260806-1" type="module"></script>
  <script src="./register-sw.js?v=20260806-1"></script>
</body>
</html>
