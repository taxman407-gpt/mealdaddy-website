name: Live Chromium recovery delivery check
on:
  push:
    branches: [fix/recovery-e2e-20261108]
    paths: [.github/workflows/live-recovery-browser-20261108.yml]
permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Chromium test tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check deployed UI and request one recovery email
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import asyncio, datetime, hashlib, json, os, pathlib, subprocess
          from playwright.async_api import async_playwright
          BASES={'production':'https://www.mealdaddy.ai','beta':'https://mealdaddy-october-test.taxman407.workers.dev'}
          # Reuse the owner's already-public commit identity, previously verified against
          # the connected mailbox and owner registry. Never log the address or credentials.
          email=subprocess.check_output(['git','show','-s','--format=%ae','48a6b30e8fec76e09f869d9a310aefb949803e74'],text=True).strip().lower()
          assert hashlib.sha256(email.encode()).hexdigest()=='b560c1fe25ee3951b7da5b15a254e1ad60595410f98b30e8bc1d27bd7fe0960c','Unexpected owner mailbox; no email will be requested'
          pathlib.Path('browser-evidence').mkdir(exist_ok=True)
          results=[]
          def record(check,passed,details):
              item={'check':check,'passed':passed,'details':details};results.append(item);print(json.dumps(item),flush=True)
          async def main():
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch()
                  contexts=[]
                  try:
                      for label,base in BASES.items():
                          context=await browser.new_context(viewport={'width':1280,'height':900})
                          contexts.append(context)
                          page=await context.new_page()
                          errors=[]
                          page.on('pageerror',lambda error:errors.append(str(error).split('\n')[0][:180]))
                          response=await page.goto(base+'/app/auth.html',wait_until='networkidle',timeout=45000)
                          await page.locator('#auth-submit').wait_for(state='visible',timeout=15000)
                          scripts=await page.locator('script[src]').evaluate_all('(nodes)=>nodes.map(n=>new URL(n.src).pathname+new URL(n.src).search)')
                          record(label+': actual Chromium sign-in screen',response.status==200 and await page.locator('#email').is_visible() and await page.locator('#password').is_visible(),{'http_status':response.status,'auth_scripts':[s for s in scripts if '/auth.js' in s],'page_errors':errors})
                          await page.screenshot(path='browser-evidence/'+label+'-signin.png',full_page=True)
                          if label=='beta':
                              await page.locator('#email').fill(email)
                              try:
                                  async with page.expect_response(lambda r:'/auth/v1/recover' in r.url and r.request.method=='POST',timeout=30000) as requested:
                                      await page.locator('#reset-password').click()
                                  result=await requested.value
                                  payload=await result.json()
                                  await page.wait_for_timeout(1000)
                                  status=await page.locator('#auth-status').inner_text()
                                  record('beta: one real recovery email request',result.status==200,{'http_status':result.status,'service_error_code':payload.get('error_code') or payload.get('code'),'ui_status':status.replace(email,'[owner email]'),'code_field_visible':await page.locator('#recovery-code').is_visible() if await page.locator('#recovery-code').count() else False})
                              except Exception as error:
                                  record('beta: recovery email request',False,{'exception_type':type(error).__name__})
                              await page.screenshot(path='browser-evidence/beta-recovery-request.png',full_page=True,mask=[page.locator('#email')])
                  finally:
                      for context in contexts:await context.close()
                      await browser.close()
          asyncio.run(main())
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Real deployed Chromium pages and one recovery email request. No password update, no authenticated login, and no meal writes were attempted. Email arrival must be checked separately.','checks':results}
          pathlib.Path('browser-evidence/report.json').write_text(json.dumps(report,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Live browser recovery delivery check\n\n'+report['scope']+'\n\n')
              for r in results:f.write(('- PASS: ' if r['passed'] else '- FAIL: ')+r['check']+' — '+json.dumps(r['details'])+'\n')
          if not all(r['passed'] for r in results):raise SystemExit(1)
          PY
      - name: Retain redacted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redacted-live-browser-evidence
          path: browser-evidence/
          retention-days: 7
