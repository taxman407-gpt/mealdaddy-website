name: Repair and verify recovery state
on:
  push:
    branches: [fix/recovery-e2e-20261108]
    paths: [.github/workflows/recovery-repair-20261108.yml]
permissions:
  contents: write
jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-e2e-20261108
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reproduce the recovery-code defect
        run: |
          if grep -q 'recoveryCodeVerificationPending' app/auth.js; then
            echo 'Repair already present; rerunning verification.'
          else
            if node tests/auth-recovery-otp-regression.mjs > /tmp/recovery-before.txt 2>&1; then
              echo 'Expected the regression test to reproduce the unfixed defect.'
              exit 1
            fi
            grep 'Recovery code must preserve the chosen password' /tmp/recovery-before.txt
            echo 'Confirmed: successful OTP verification discarded the requested password.'
          fi
      - name: Apply narrow recovery-state and cache-consistency corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app/auth.js')
          text=path.read_text()
          if 'recoveryCodeVerificationPending' not in text:
              def once(old,new):
                  global text
                  assert text.count(old)==1, 'Expected one exact patch target: '+old[:70]
                  text=text.replace(old,new,1)
              once('let recoveryCodeRequested = false;', 'let recoveryCodeRequested = false;\nlet recoveryCodeVerificationPending = false;\nlet recoveryRequestPending = false;\nlet recoveryRequestAfter = 0;')
              once('function showRecoveryForm() {', 'function showRecoveryForm(options = {}) {')
              start=text.index('function showRecoveryForm(options = {}) {')
              end=text.index('\nconst returnTo =',start)
              section=text[start:end]
              assert section.count('  password.value = "";')==1
              section=section.replace('  password.value = "";', '  if (!options.preservePassword) {\n    password.value = "";\n    confirmPassword.value = "";\n  }',1)
              text=text[:start]+section+text[end:]
              once('''    const { error } = await supabase.auth.verifyOtp({
                email: email.value.trim(),
                token,
                type: "recovery"
              });'''.replace('                ', '      ').replace('              });', '    });'), '''    const requestedPassword = password.value;
              const requestedConfirmation = confirmPassword.value;
              let verification;
              try {
                recoveryCodeVerificationPending = true;
                verification = await supabase.auth.verifyOtp({
                  email: email.value.trim(), token, type: "recovery"
                });
              } catch (error) {
                verification = { error };
              } finally {
                recoveryCodeVerificationPending = false;
              }
              const { error } = verification;'''.replace('\n              ', '\n    '))
              once('''    showRecoveryForm();
            }
            if (recoverySession) {'''.replace('\n            ', '\n  '), '''    showRecoveryForm({ preservePassword: true });
              password.value = requestedPassword;
              confirmPassword.value = requestedConfirmation;
            }
            if (recoverySession) {'''.replace('\n              ', '\n    ').replace('\n            ', '\n  '))
              once('''  event.preventDefault();
            submit.disabled = true;'''.replace('\n            ', '\n  '), '''  event.preventDefault();
            if (submit.disabled) return;
            submit.disabled = true;'''.replace('\n            ', '\n  '))
              once('''    status.textContent = "Updating your password...";''', '''    if (password.value.length < 8) {
                submit.disabled = false;
                status.textContent = "Use at least eight characters for your new password.";
                password.focus();
                return;
              }
              status.textContent = "Updating your password...";'''.replace('\n              ', '\n    ').replace('\n                ', '\n      '))
              once('if (event === "PASSWORD_RECOVERY") showRecoveryForm();', 'if (event === "PASSWORD_RECOVERY" && !recoveryCodeVerificationPending && !recoverySession) showRecoveryForm();')
              reset_start=text.index('document.querySelector("#reset-password").addEventListener("click", async () => {')
              reset_end=text.index('\nsupabase.auth.onAuthStateChange',reset_start)
              replacement='''document.querySelector("#reset-password").addEventListener("click", async () => {
            if (recoveryRequestPending) return;
            if (Date.now() < recoveryRequestAfter) {
              status.textContent = "Please wait a minute before requesting another recovery email. Check your inbox and spam folder for the newest message.";
              return;
            }
            const address = email.value.trim();
            if (!address) {
              status.textContent = "Enter your email address first.";
              email.focus();
              return;
            }
            const resetButton = document.querySelector("#reset-password");
            const recoveryTarget = new URL("./auth.html", location.href);
            recoveryTarget.searchParams.set("mode", "recovery");
            recoveryTarget.searchParams.set("returnTo", safeReturnTo);
            recoveryRequestPending = true;
            resetButton.disabled = true;
            status.textContent = "Requesting your recovery email…";
            try {
              const { error } = await supabase.auth.resetPasswordForEmail(address, { redirectTo: recoveryTarget.href });
              if (error) throw error;
              recoveryRequestAfter = Date.now() + 60000;
              history.replaceState(null, "", recoveryTarget.href);
              showRecoveryCodeForm();
              status.textContent = "Recovery email requested. Open its reset link, or enter the six-digit code if the email includes one. Check your spam folder too.";
            } catch (error) {
              const limited = error?.status === 429 || /rate|too many/i.test(error?.code || "") || /rate.*limit|too many/i.test(error?.message || "");
              if (limited) recoveryRequestAfter = Date.now() + 60000;
              status.textContent = limited
                ? "The email service is temporarily rate-limited. Do not keep resending. Use the newest recovery email already received, or try again later."
                : error?.message || "The recovery email request could not be completed. Your password has not changed.";
            } finally {
              recoveryRequestPending = false;
              resetButton.disabled = false;
            }
          });
          '''
              replacement='\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.split('\n'))
              text=text[:reset_start]+replacement+text[reset_end:]
              text=text.replace('Enter the six-digit code from your email, then choose and confirm a new password.', 'Open the reset link in your email, or enter its six-digit code below and choose a new password.')
              text=text.replace('Enter the six-digit code from your recovery email. If you only have an older reset link, request a fresh code below.', 'Open the reset link in your recovery email, or enter its six-digit code below. Request a new email only if the existing one has expired.')
              text=text.replace('Your recovery link was accepted.', 'Your recovery code or link was accepted.')
              path.write_text(text)
          for filename in ['app/auth.html','app/service-worker.js','tests/release-cache-consistency.mjs']:
              p=Path(filename);s=p.read_text()
              import re
              s=re.sub(r'auth\.js\?v=\d{8}-\d+', 'auth.js?v=20261108-1', s)
              p.write_text(s)
          for p in [Path('worker.js'),Path('app/service-worker.js'),*Path('tests').glob('*.mjs')]:
              s=p.read_text()
              changed=s.replace('mealdaddy-shell-v98','mealdaddy-shell-v99').replace('20261031-v98','20261108-v99')
              if changed!=s:p.write_text(changed)
          print('Applied OTP password preservation, recovery-event guard, duplicate-email guard, clearer rate-limit feedback and aligned cache versions.')
          PY
      - name: Install pinned dependencies
        run: npx --yes pnpm@9.10.0 install --frozen-lockfile
      - name: Build and run the full regression suite
        run: |
          npm run build
          npm test
      - name: Record verified source changes on the repair branch only
        run: |
          git config user.name 'MealDaddy verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/auth.js app/auth.html app/service-worker.js worker.js tests/
          if ! git diff --cached --quiet; then
            git commit -m 'Fix recovery-code password loss, duplicate reset requests and stale auth cache references'
            git push origin HEAD:fix/recovery-e2e-20261108
          fi
