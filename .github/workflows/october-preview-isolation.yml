name: October test preview isolation
on:
  push:
    branches:
      - feature/october-2026-upgrade
  pull_request:
    paths:
      - 'worker.test.js'
      - 'wrangler.test.jsonc'
      - 'tests/test-preview-isolation.test.mjs'
      - '.github/workflows/october-preview-isolation.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx --yes pnpm@9.10.0 install --frozen-lockfile
      - run: npm run build
      - run: npm test
